set -g default-terminal "tmux-256color"
# True color for the outer terminal (replaces the old Tc override)
set -as terminal-features ",xterm-256color:RGB"

set -g history-limit 50000
set -g focus-events on

setw -g window-status-current-style fg=black,bg=white
setw -g mouse on

# Maus-Auswahl direkt in System-Clipboard kopieren
set -g set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

set -g base-index 1
setw -g pane-base-index 1

set -g prefix2 C-s

# Show session names in  in Iterm
set-option -g set-titles on

# Set new Prefix
#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix

# Disable right click mouse menue
unbind -n MouseDown3Pane

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# make delay shorter
set -sg escape-time 0

# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ctrl+h/j/k/l without prefix, passed through to vim (vim-tmux-navigator).
# fzf is left out on purpose so panes running ai-review still switch.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# Ctrl+l is taken now, clear the screen with prefix Ctrl+l
bind C-l send-keys C-l

# Window switching without prefix: Alt+h/l previous/next, Alt+1..9 direct
# (Terminal.app: Profile > Keyboard > "Use Option as Meta key")
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
# keep window numbers gapless so Alt+N stays predictable
set -g renumber-windows on

# AI assisted coding: review popups (scripts in ~/git/dotfiles/bin)
#   prefix g  lazygit in the current pane's directory
#   prefix R  ai-review: Cairn tasks tagged "Review AI Work"
#   prefix A  ai-changes: repos with unpushed or uncommitted work
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind R display-popup -E -w 90% -h 90% -d "#{pane_current_path}" ~/git/dotfiles/bin/ai-review
bind A display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "~/git/dotfiles/bin/ai-changes --pick"


source-file ~/git/dotfiles/tmux/themes/gruvbox.conf
