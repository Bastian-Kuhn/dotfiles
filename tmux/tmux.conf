set -g default-terminal "tmux-256color"
# True color for the outer terminal (replaces the old Tc override)
set -as terminal-features ",xterm-256color:RGB"

set -g history-limit 50000
set -g focus-events on

setw -g window-status-current-style fg=black,bg=white
setw -g mouse on

# Maus-Auswahl direkt in System-Clipboard kopieren
set -g set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

set -g base-index 1
setw -g pane-base-index 1

set -g prefix2 C-s

# Show session names in  in Iterm
set-option -g set-titles on

# Set new Prefix
#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix

# Disable right click mouse menue
unbind -n MouseDown3Pane

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# make delay shorter
set -sg escape-time 0

# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# AI assisted coding: review popups (scripts in ~/git/dotfiles/bin)
#   prefix g  lazygit in the current pane's directory
#   prefix R  ai-review: Cairn tasks tagged "Review AI Work"
#   prefix A  ai-changes: repos with unpushed or uncommitted work
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind R display-popup -E -w 90% -h 90% -d "#{pane_current_path}" ~/git/dotfiles/bin/ai-review
bind A display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "~/git/dotfiles/bin/ai-changes --pick"


source-file ~/git/dotfiles/tmux/themes/gruvbox.conf
